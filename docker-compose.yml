
services:
  dmfrontend:
    build:
      context: ./dmfrontend
      dockerfile: Dockerfile

    container_name: autosar-ai-dmfrontend

    ports:
      - "5173:5173"

    volumes:
      - ./dmfrontend:/app
      - dmfrontend_node_modules:/app/node_modules

    environment:
      VITE_API_URL: http://localhost:5000/api

    stdin_open: true
    tty: true

    depends_on:
      - dmbackend

  dmbackend:
    build:
      context: ./dmbackend
      dockerfile: Dockerfile

    container_name: autosar-ai-dmbackend

    ports:
      - "5000:5000"

    volumes:
      - ./dmbackend:/app
      - ./dmbackend/data:/app/data

    env_file:
      - ./dmbackend/.env

    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: qwen2.5:3b
      OLLAMA_TIMEOUT: "180"

    depends_on:
      - ollama

    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest

    container_name: autosar-ollama

    ports:
      - "11434:11434"

    volumes:
      - ollama_models:/root/.ollama

    restart: unless-stopped

volumes:
  dmfrontend_node_modules:
  ollama_models:
